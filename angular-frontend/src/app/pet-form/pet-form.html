<div class="page">

  <mat-card>

    <h2>
      {{ modoEdicao ? 'Editar Pet' : 'Novo Pet' }}
    </h2>

    <div *ngIf="carregando" class="loading">
      <mat-spinner diameter="45"></mat-spinner>
    </div>

	<form #petForm="ngForm" (ngSubmit)="onSubmit(petForm)"
	      (keydown.enter)="$event.preventDefault(); onSubmit(petForm)">

      <mat-form-field appearance="outline">

        <mat-label>Nome</mat-label>

        <input
          matInput
          id="nome"
          name="nome"
          [(ngModel)]="pet.nome"
          required>

        <mat-icon matSuffix>pets</mat-icon>

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>Espécie</mat-label>

        <mat-select
          id="especie"
          name="especie"
          [(ngModel)]="pet.especie"
          required>

          <mat-option
            *ngFor="let e of especies"
            [value]="e">

            {{ e }}

          </mat-option>

        </mat-select>

        <mat-icon matSuffix>category</mat-icon>

      </mat-form-field>
      
      <mat-form-field appearance="outline">
		  <mat-label>Data de Nascimento</mat-label>
		  <input
		    matInput
		    id="dataNascimento"
		    name="dataNascimento"
		    [matDatepicker]="picker"
		    [(ngModel)]="dataNascimentoDate"
		    [max]="hoje">
		  <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
		  <mat-datepicker #picker></mat-datepicker>
		</mat-form-field>
		
		<mat-form-field appearance="outline">
		  <mat-label>Peso (gramas)</mat-label>
		  <input
		    matInput
		    type="number"
		    id="peso"
		    name="peso"
		    min="0"
		    step="1"
		    [(ngModel)]="pet.peso"
		    #peso="ngModel">
		  <mat-icon matSuffix>scale</mat-icon>
		  <mat-error *ngIf="peso.invalid">
		    Peso deve ser 0 ou maior
		  </mat-error>
		</mat-form-field>
      
      <mat-form-field appearance="outline">
		  <mat-label>Latitude</mat-label>
		  <input
		    matInput
		    type="number"
		    id="latitude"
		    name="latitude"
		    step="any"
		    min="-90"
		    max="90"
		    [(ngModel)]="pet.latitude"
		    #latitude="ngModel">
		  <mat-icon matSuffix>explore</mat-icon>
		  <mat-error *ngIf="latitude.invalid">
		    Latitude deve estar entre -90 e 90
		  </mat-error>
		</mat-form-field>
		
		<mat-form-field appearance="outline">
		  <mat-label>Longitude</mat-label>
		  <input
		    matInput
		    type="number"
		    id="longitude"
		    name="longitude"
		    step="any"
		    min="-180"
		    max="180"
		    [(ngModel)]="pet.longitude"
		    #longitude="ngModel">
		  <mat-icon matSuffix>explore</mat-icon>
		  <mat-error *ngIf="longitude.invalid">
		    Longitude deve estar entre -180 e 180
		  </mat-error>
		</mat-form-field>

      <div
        *ngIf="mensagens"
        class="error">

        {{ mensagens }}

      </div>

      <div class="actions">

        <button
          mat-raised-button
          color="primary"
          type="submit">

          <mat-icon>save</mat-icon>

          Salvar

        </button>

        <button
          mat-stroked-button
          routerLink="/pets"
          type="button">

          <mat-icon>arrow_back</mat-icon>

          Voltar

        </button>

      </div>

    </form>

  </mat-card>

</div>
