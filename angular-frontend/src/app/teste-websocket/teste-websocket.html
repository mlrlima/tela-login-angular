<div style="padding:20px">

    <h2>Teste WebSocket</h2>

    <button (click)="conectar()">
        Conectar / Escutar
    </button>

    <button (click)="enviar()">
        Enviar mensagem
    </button>

    <hr>

    <h3>Mensagens recebidas:</h3>

    <div *ngFor="let mensagem of mensagens">
        {{ mensagem }}
    </div>

</div>
